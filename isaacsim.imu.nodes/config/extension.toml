[package]
version = "0.1.0"
category = "Sensors "
title = "IMU  OmniGraph Nodes"
description = "A new Isaac Sim OmniGraph node extension."
authors = []
keywords = ["isaac"]
changelog = "docs/CHANGELOG.md"
readme = "docs/Overview.md"
preview_image = "data/preview.png"
icon = "data/icon.png"
writeTarget.kit = true
writeTarget.platform = true

[dependencies]
"omni.graph" = {}
"omni.kit.uiapp" = {}


[[python.module]]
name = "isaacsim.imu.nodes"

[[python.module]]
name = "isaacsim.imu.nodes.tests"

[[native.plugin]]
path = "bin/*.plugin"
recursive = false

[fswatcher.patterns]
include = ["*.ogn", "*.py"]
exclude = ["Ogn*Database.py"]

[[test]]
name = "startup"

[[test]]

[documentation]
pages = ["docs/Overview.md", "docs/CHANGELOG.md"]
